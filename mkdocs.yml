site_name: Digital Slide Archive Documentation
site_url: https://gutman-lab.github.io/dsa-docs/
site_description: Guides and reference for installing, using, and extending the Digital Slide Archive.
repo_url: https://github.com/Gutman-Lab/dsa-docs
repo_name: Gutman-Lab/dsa-docs
edit_uri: edit/main/docs/
copyright: Digital Slide Archive contributors

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - content.action.edit
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-switcher.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get Started:
      - What is DSA?: get-started/what-is-dsa.md
      - Try the demo: get-started/try-the-demo.md
      - Install on one machine: get-started/install.md
      - Install on Ubuntu 24.04 (DSA 5): get-started/install-ubuntu-24-04.md
      - Upload and view your first slide: get-started/first-slide.md
      - Next steps: get-started/next-steps.md
      - Migration guide: migration.md
  - User Guide:
      - Overview: user-guide/index.md
      - Mouse and keyboard controls: user-guide/controls.md
      - Annotation basics: user-guide/annotations.md
      - Annotation style groups: user-guide/annotation-groups.md
      - Permissions and access control: user-guide/permissions.md
  - Administration:
      - Overview: admin/index.md
      - Admin console tour: admin/admin-console.md
      - Users, groups, and roles: admin/users-and-roles.md
      - Assetstores and storage: admin/assetstores-and-storage.md
      - Plugin and system settings: admin/settings.md
  - System Overview: system-overview.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Connect to a server: tutorials/connect.md
      - Create a collection: tutorials/create-a-collection.md
      - Create a folder: tutorials/create-a-folder.md
      - Upload or import images: tutorials/upload-images.md
      - Copy an item: tutorials/copy-an-item.md
      - Edit metadata: tutorials/edit-metadata.md
      - Share a collection or folder: tutorials/share-a-collection.md
      - Annotate a slide: tutorials/annotate-a-slide.md
      - Run an analysis: tutorials/run-an-analysis.md
  - Reference:
      - REST API: reference/rest-api.md
      - Python client: reference/python-client.md
      - UI components (bdsa-react-components): reference/bdsa-react-components.md
  - Help:
      - Troubleshooting and FAQ: troubleshooting.md
  - Release notes: release-notes.md
  - Contributing: contributing.md
  - About:
      - About the project: about.md
      - Success stories: success-stories.md
      - Papers and publications: papers-publications.md
