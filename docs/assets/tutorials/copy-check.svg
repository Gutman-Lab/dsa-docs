<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">Checking an item in a folder</title>
  <desc id="desc">A schematic of a folder page with three item rows. The first row's checkbox is checked, and the Checked actions button is enabled and shows one checked item.</desc>
  <rect width="880" height="300" fill="#ffffff"/>
  <rect x="20" y="20" width="840" height="230" rx="8" fill="#fafafa" stroke="#d0d7de"/>
  <text x="44" y="56" font-family="system-ui, sans-serif" font-size="15" fill="#57606a">Collections / Demo / Kidney cases</text>

  <g font-family="system-ui, sans-serif" font-size="13">
    <rect x="44" y="74" width="792" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="56" y="84" width="18" height="18" rx="3" fill="#0969da" stroke="#0969da"/>
    <path d="M60 93l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="92" y="97" fill="#57606a">Checked actions</text>
    <path d="M176 90l5 5-5 5" fill="none" stroke="#57606a" stroke-width="2"/>
    <text x="660" y="97" text-anchor="end" fill="#57606a">1 checked</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14">
    <rect x="44" y="130" width="792" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="58" y="140" width="16" height="16" rx="3" fill="#0969da" stroke="#0969da"/>
    <path d="M61 148l3 3 6-6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="88" y="142" width="10" height="13" rx="2" fill="none" stroke="#57606a" stroke-width="1.5"/>
    <text x="108" y="153" fill="#24292f">case-01.svs</text>

    <rect x="44" y="166" width="792" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="58" y="176" width="16" height="16" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <rect x="88" y="178" width="10" height="13" rx="2" fill="none" stroke="#57606a" stroke-width="1.5"/>
    <text x="108" y="189" fill="#24292f">case-02.svs</text>

    <rect x="44" y="202" width="792" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="58" y="212" width="16" height="16" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <rect x="88" y="214" width="10" height="13" rx="2" fill="none" stroke="#57606a" stroke-width="1.5"/>
    <text x="108" y="225" fill="#24292f">case-03.svs</text>
  </g>

  <text x="20" y="282" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">Schematic, not a screenshot: check the box at the left of an item row. The Checked actions menu becomes active.</text>
</svg>
