<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="title desc">
  <title id="title">The Metadata panel with the add menu and an editing row</title>
  <desc id="desc">A schematic of the Metadata section. The plus button opens a menu with Simple and JSON. One saved row shows case_id and K-2026-014. A second row is being edited, with key stain, value H and E, and cancel and accept buttons.</desc>
  <rect width="880" height="310" fill="#ffffff"/>
  <rect x="20" y="20" width="840" height="240" rx="8" fill="#fafafa" stroke="#d0d7de"/>

  <g font-family="system-ui, sans-serif">
    <path d="M44 44h6l8 8-6 6-8-8z" fill="none" stroke="#57606a" stroke-width="1.6"/>
    <text x="68" y="54" font-size="16" font-weight="600" fill="#24292f">Metadata</text>

    <rect x="784" y="34" width="44" height="28" rx="4" fill="#0969da"/>
    <path d="M806 42v12M800 48h12" stroke="#ffffff" stroke-width="2"/>

    <rect x="660" y="70" width="168" height="74" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="678" y="95" font-size="14" fill="#24292f">Simple</text>
    <line x1="660" y1="108" x2="828" y2="108" stroke="#eaeef2"/>
    <text x="678" y="129" font-size="14" fill="#24292f">JSON</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14">
    <rect x="40" y="102" width="600" height="48" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <path d="M58 126l6 6 10-12" fill="none" stroke="#57606a" stroke-width="1.8"/>
    <text x="88" y="131" font-weight="600" fill="#24292f">case_id</text>
    <text x="200" y="131" fill="#24292f">K-2026-014</text>

    <rect x="40" y="158" width="600" height="72" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <rect x="56" y="170" width="130" height="26" rx="4" fill="#ffffff" stroke="#8c959f"/>
    <text x="64" y="188" fill="#24292f">stain</text>
    <rect x="56" y="202" width="330" height="20" rx="4" fill="#ffffff" stroke="#8c959f"/>
    <text x="64" y="217" fill="#24292f">H&amp;E</text>

    <rect x="520" y="170" width="28" height="26" rx="4" fill="#bf8700"/>
    <path d="M528 176l12 12M540 176l-12 12" stroke="#ffffff" stroke-width="2"/>
    <rect x="556" y="170" width="28" height="26" rx="4" fill="#0969da"/>
    <path d="M562 183l6 6 10-11" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  </g>

  <text x="20" y="288" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">Schematic, not a screenshot: add a row with the plus menu, then accept it with the check mark. There is no page-level Save button.</text>
</svg>
