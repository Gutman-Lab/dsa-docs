<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">The checked actions menu in the destination folder</title>
  <desc id="desc">A schematic of a destination folder page. The Checked actions menu is open and offers Move picked resources here, Copy picked resources here and Clear picked resources.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <rect x="20" y="20" width="840" height="270" rx="8" fill="#fafafa" stroke="#d0d7de"/>
  <text x="44" y="56" font-family="system-ui, sans-serif" font-size="15" fill="#57606a">Collections / Demo / Archive</text>

  <rect x="44" y="74" width="792" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="56" y="84" width="18" height="18" rx="3" fill="#0969da" stroke="#0969da"/>
  <path d="M60 93l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="92" y="97" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">Checked actions</text>
  <path d="M176 90l5 5-5 5" fill="none" stroke="#57606a" stroke-width="2"/>

  <rect x="60" y="128" width="250" height="122" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="system-ui, sans-serif" font-size="14">
    <text x="78" y="154" fill="#24292f">Move picked resources here</text>
    <line x1="60" y1="168" x2="310" y2="168" stroke="#eaeef2"/>
    <text x="78" y="194" fill="#24292f">Copy picked resources here</text>
    <line x1="60" y1="208" x2="310" y2="208" stroke="#eaeef2"/>
    <text x="78" y="234" fill="#24292f">Clear picked resources (1)</text>
  </g>

  <text x="360" y="158" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">Pick first, then navigate here.</text>
  <text x="360" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">The picked item stays selected while you move</text>
  <text x="360" y="200" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">through the folder tree, as long as the tab is open.</text>

  <text x="20" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">Schematic, not a screenshot: copying starts only when you choose Copy picked resources here.</text>
</svg>
